name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # find_ffmpeg_finds_binary 가 실제 탐색을 검증한다 — 러너 이미지에는 ffmpeg 이 없다.
      # setup-ffmpeg 액션은 arm64 macOS(macos-latest 기본)를 지원하지 않아 패키지 매니저로 설치한다.
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: cargo test
        working-directory: src-tauri
      - run: cargo build --release
        working-directory: src-tauri

  engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node vendor/gmotion/assets/gm.js test
